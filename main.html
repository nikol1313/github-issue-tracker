<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <title>Document</title>
</head>
<body>
    <main>
        <header>
            <h1>Task Manager</h1>
            <p>Create, Search, Delete</p>
        </header>
        <form id="task-form">
            <input type="text" id="input-bar" name="task-name" placeholder="Enter Task Name">
            <label for="desc">Description</label>
            <textarea id="desc" name="desc" rows="4" cols="50"></textarea>

    <fieldset>
        <legend>Select priority</legend>

    <div>
        <input type="radio" id="low" name="priority" value="Low"/>
        <label for="low">Low</label>
    </div>

    <div>
        <input type="radio" id="normal" name="priority" value="normal" checked/>
        <label for="normal">Normal</label>
    </div>

    <div>
        <input type="radio" id="high" name="priority" value="high"/>
        <label for="high">High</label>
    </div>
    </fieldset>

    <button type="submit">Create Task</button>

        </form>
    </main>
</body>
</html>
